plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.argoletscanner'
version = '1.0.0'

android {
  namespace "expo.modules.argoletscanner"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Google's document scanner (the one in Google Drive): edge detection, crop, filters, cleaning.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
