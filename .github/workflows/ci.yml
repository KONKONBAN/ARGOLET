name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · unit/integration · build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: argolet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/argolet_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @argolet/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  mobile:
    name: Mobile bundles (Android · iOS · web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @argolet/mobile typecheck
      - run: pnpm --filter @argolet/mobile exec expo export --platform android --platform ios --platform web --output-dir dist-ci

  docker:
    name: Docker image (build + container smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t argolet:ci .
      - name: Run the production image and check API + web
        run: |
          docker run -d --name argolet -p 8080:8080 -e PEPPER="$(openssl rand -hex 32)" -e COOKIE_SECURE=false argolet:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/healthz
          curl -sf http://127.0.0.1:8080/v1/meta | grep -q '"name":"ARGOLET"'
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec argolet node -v
          docker inspect --format '{{.State.Health.Status}}' argolet
      - if: failure()
        run: docker logs argolet || true
