name: Deploy web app (GitHub Pages)

# Publishes apps/web/dist; the whole app runs in the browser with demo data.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main, claude/nifty-clarke-xsratt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@argolet/web..."
      - run: pnpm --filter @argolet/web build
        env:
          VITE_STATIC_DEMO: '1'
      - id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: echo "::notice title=GitHub Pages chưa bật::Bật tại Settings → Pages → Source - GitHub Actions, rồi chạy lại workflow này (Run workflow)."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
